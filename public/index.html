<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
function toMinutes(val) {
  if (!val || !val.includes(":")) return null;
  let [h, m] = val.split(":").map(Number);
  return h * 60 + m;
}

const KEKA_SYNC_FILES = [
  "manifest.json",
  "content.js",
  "popup.html",
  "popup.js",
  "icon128.png",
  "cat-icon.svg",
  "fun-tab-icon.svg"
];

// zips the current extension files in-browser so the download always
// reflects whatever's actually in extensions/keka-sync/, no stale prebuilt zip
async function downloadExtension(e) {
  const btn = e.target.closest("button");
  const originalText = btn.textContent;
  btn.textContent = "Zipping…";
  btn.disabled = true;

  try {
    const zip = new JSZip();
    const folder = zip.folder("keka-sync");

    await Promise.all(KEKA_SYNC_FILES.map(async (file) => {
      const res = await fetch(`extensions/keka-sync/${file}`);
      const blob = await res.blob();
      folder.file(file, blob);
    }));

    const blob = await zip.generateAsync({ type: "blob" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "keka-sync.zip";
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert("Couldn't build the extension zip. Please try again.");
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

function showSteps() {
  const el = document.getElementById("steps");
  el.style.display = el.style.display === "none" ? "block" : "none";
}

function openExtensions() {
  navigator.clipboard.writeText("chrome://extensions");
  document.getElementById("copyMsg").style.display = "block";
}

const THEME_KEY = "goHomeEarly-theme-hue";

function applyTheme(hue) {
  const root = document.documentElement.style;
  root.setProperty("--accent", `hsl(${hue}, 65%, 50%)`);
  root.setProperty("--bg", `hsl(${hue}, 25%, 8%)`);
  root.setProperty("--card-bg", `hsl(${hue}, 20%, 13%)`);
  root.setProperty("--input-bg", `hsl(${hue}, 18%, 19%)`);
}

function shuffleTheme() {
  const hue = Math.floor(Math.random() * 360);
  applyTheme(hue);
  localStorage.setItem(THEME_KEY, hue);
}

function resetTheme() {
  const root = document.documentElement.style;
  root.removeProperty("--accent");
  root.removeProperty("--bg");
  root.removeProperty("--card-bg");
  root.removeProperty("--input-bg");
  localStorage.removeItem(THEME_KEY);
}

const savedHue = localStorage.getItem(THEME_KEY);
if (savedHue !== null) applyTheme(Number(savedHue));

const DAY_IDS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const DATA_KEY = "goHomeEarly-data";

function getWeekStartKey() {
  const now = new Date();
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  const y = monday.getFullYear();
  const m = String(monday.getMonth() + 1).padStart(2, "0");
  const d = String(monday.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function saveData() {
  const data = {
    weekStart: getWeekStartKey(),
    avgH: document.getElementById("avgH").value,
    avgM: document.getElementById("avgM").value,
    leaveH: document.getElementById("leaveH").value,
    leaveM: document.getElementById("leaveM").value,
    workDays: document.getElementById("workDays").value,
  };
  DAY_IDS.forEach(id => { data[id] = document.getElementById(id).value; });
  localStorage.setItem(DATA_KEY, JSON.stringify(data));
}

function loadData() {
  const raw = localStorage.getItem(DATA_KEY);
  if (!raw) return;
  const data = JSON.parse(raw);
  if (data.avgH !== undefined) document.getElementById("avgH").value = data.avgH;
  if (data.avgM !== undefined) document.getElementById("avgM").value = data.avgM;
  if (data.leaveH !== undefined) document.getElementById("leaveH").value = data.leaveH;
  if (data.leaveM !== undefined) document.getElementById("leaveM").value = data.leaveM;
  if (data.workDays !== undefined) document.getElementById("workDays").value = data.workDays;

  // a new work week means last week's day times are stale — don't carry them over
  const isNewWeek = data.weekStart !== undefined && data.weekStart !== getWeekStartKey();
  if (isNewWeek) {
    saveData();
    return;
  }

  DAY_IDS.forEach(id => {
    if (data[id] !== undefined) document.getElementById(id).value = data[id];
  });
}

function clearTimes() {
  DAY_IDS.forEach(id => {
    const input = document.getElementById(id);
    input.value = "";
    input.classList.remove("input-error");
  });
  saveData();

  document.getElementById("total").textContent = "--";
  document.getElementById("remaining").textContent = "--";
  const statusDiv = document.getElementById("status");
  statusDiv.textContent = "";
  statusDiv.className = "status";
}

// manually flag any day — past, present, or future — as a leave day, filled
// with the configurable Leave Hours setting (not tied to any one person's
// default, since it reads whatever's currently set)
function markLeave(dayId) {
  const leaveH = parseInt(document.getElementById("leaveH").value) || 8;
  const leaveM = parseInt(document.getElementById("leaveM").value) || 0;
  const input = document.getElementById(dayId);
  input.value = `${leaveH}:${String(leaveM).padStart(2, "0")}`;
  input.classList.remove("input-error");
  saveData();
}

document.querySelectorAll(".leave-btn").forEach(btn => {
  btn.addEventListener("click", () => markLeave(btn.dataset.target));
});

document.getElementById("leaveToggle").addEventListener("click", () => {
  const row = document.getElementById("leaveRow");
  const arrow = document.getElementById("leaveArrow");
  const isHidden = row.style.display === "none";
  row.style.display = isHidden ? "" : "none";
  arrow.textContent = isHidden ? "▾" : "▸";
});

function getWorkDays() {
  const n = parseInt(document.getElementById("workDays").value) || 5;
  return Math.min(7, Math.max(1, n));
}

function updateVisibleDays() {
  const workDays = getWorkDays();
  document.querySelectorAll(".day-row").forEach(row => {
    row.classList.toggle("hidden", Number(row.dataset.day) > workDays);
  });
}

loadData();
updateVisibleDays();

document.getElementById("workDays").addEventListener("input", () => {
  updateVisibleDays();
  saveData();
});

["avgH", "avgM", "leaveH", "leaveM"].forEach(id => {
  document.getElementById(id).addEventListener("input", saveData);
});

function formatTimeInput(e) {
  const input = e.target;

  // keep only digits and colon, then keep just the first colon
  let raw = input.value.replace(/[^\d:]/g, "");
  const firstColon = raw.indexOf(":");
  if (firstColon !== -1) {
    raw = raw.slice(0, firstColon + 1) + raw.slice(firstColon + 1).replace(/:/g, "");
  }

  // a colon needs a digit before it, otherwise drop it
  if (raw.startsWith(":")) raw = raw.slice(1);

  const hasColon = raw.includes(":");
  let hh, mm;

  if (hasColon) {
    [hh, mm] = raw.split(":");
    hh = hh.slice(0, 2);
    mm = mm.slice(0, 2);
  } else {
    const digits = raw.slice(0, 4);
    hh = digits.slice(0, 2);
    mm = digits.slice(2);
  }

  if (hh.length === 2 && Number(hh) > 24) hh = "24";
  if (mm.length >= 1 && Number(mm[0]) > 5) mm = "5" + mm.slice(1);
  if (mm.length === 2 && Number(mm) > 59) mm = "59";
  if (hh === "24" && mm.length > 0 && Number(mm) > 0) mm = "00";

  input.value = hasColon || mm ? hh + ":" + mm : hh;
  input.classList.remove("input-error");
}

function validateTimeInput(e) {
  const input = e.target;
  const valid = input.value === "" || /^\d{1,2}:\d{2}$/.test(input.value);
  input.classList.toggle("input-error", !valid);
}

DAY_IDS.forEach(id => {
  const input = document.getElementById(id);
  input.addEventListener("input", formatTimeInput);
  input.addEventListener("input", saveData);
  input.addEventListener("blur", validateTimeInput);
});

function calc() {
  const workDays = getWorkDays();
  const ids = DAY_IDS.slice(0, workDays);
  const values = ids.map(id => toMinutes(document.getElementById(id).value));

  const totalDiv = document.getElementById("total");
  const remainingDiv = document.getElementById("remaining");
  const statusDiv = document.getElementById("status");

  // identify today (Date.getDay(): 0=Sun..6=Sat -> shift so 0=Mon..6=Sun to match DAY_IDS)
  const todayId = DAY_IDS[(new Date().getDay() + 6) % 7];
  const todayIndex = ids.indexOf(todayId);

  // 0:00 today usually just means "not clocked out yet" — don't count it as a
  // real (early) day. But if a later day already has data, today has clearly
  // already ended, so treat its 0:00 as genuine.
  if (todayIndex !== -1 && values[todayIndex] === 0) {
    const hasLaterData = values.slice(todayIndex + 1).some(v => v !== null);
    if (!hasLaterData) values[todayIndex] = null;
  }

  // 🔥 Dynamic average
  let avgH = parseInt(document.getElementById("avgH").value) || 0;
  let avgM = parseInt(document.getElementById("avgM").value) || 0;
  let avgPerDay = (avgH * 60) + avgM;
  let weeklyTarget = avgPerDay * workDays;

  let total = 0;
  let filledDays = 0;
  let earlyDays = 0;

  values.forEach(v => {
    if (v !== null) {
      total += v;
      filledDays++;

      if (v < avgPerDay) earlyDays++;
    }
  });

  let remaining = weeklyTarget - total;
  let remainingDays = workDays - filledDays;

  let h = Math.floor(total / 60);
  let m = total % 60;

  totalDiv.innerText = `${h}h ${m}m`;

  let todayMinutes = todayIndex !== -1 ? values[todayIndex] : null;

  let todayH = Math.floor((todayMinutes || 0) / 60);
  let todayM = (todayMinutes || 0) % 60;

  if (remaining <= 0) {
    remainingDiv.innerText = `0h 0m`;
    statusDiv.innerText = "✅ You can leave now";
    statusDiv.className = "status green";
    return;
  }

  let rh = Math.floor(remaining / 60);
  let rm = remaining % 60;

  remainingDiv.innerText = `${rh}h ${rm}m`;

  // 🔥 Early leave logic with limit
  if (todayMinutes !== null && todayMinutes < avgPerDay) {

    if (earlyDays > 2) {
      statusDiv.innerText =
        `❌ Early leave limit exceeded (max 2 days)\n` +
        `Today: ${todayH}h ${todayM}m → complete target`;

      statusDiv.className = "status red";
      return;
    }

    statusDiv.innerText =
      `✅ You can go home early today (${todayH}h ${todayM}m logged)\n` +
      `📊 Remaining will be adjusted over ${remainingDays} day(s)\n` +
      `⚠️ Early days used: ${earlyDays}/2`;

    statusDiv.className = "status green";
    return;
  }

  // distribution
  if (remainingDays > 0) {
    let perDay = Math.ceil(remaining / remainingDays);

    let pdH = Math.floor(perDay / 60);
    let pdM = perDay % 60;

    statusDiv.innerText =
      `📊 Need ~${pdH}h ${pdM}m per remaining day (${remainingDays} day(s))\n` +
      `⚠️ Early days used: ${earlyDays}/2`;

    statusDiv.className = "status";
  } else {
    statusDiv.innerText =
      `❌ Need ${rh}h ${rm}m more today`;

    statusDiv.className = "status red";
  }
}

let funMode = "quote";

function switchFun(mode) {
  funMode = mode;
  document.getElementById("quoteTab").classList.toggle("active", mode === "quote");
  document.getElementById("jokeTab").classList.toggle("active", mode === "joke");

}
